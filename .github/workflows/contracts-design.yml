name: Validar contratos compartidos y diseño

on:
  push:
    branches: [main]
    paths:
      - 'packages/contracts/**'
      - 'packages/design-system/**'
      - 'apps/desktop/design/**'
      - 'scripts/check_contracts.py'
      - 'scripts/check_design_system.py'
      - 'scripts/sync_design_tokens.py'
      - '.github/workflows/contracts-design.yml'
  pull_request:
    paths:
      - 'packages/contracts/**'
      - 'packages/design-system/**'
      - 'apps/desktop/design/**'
      - 'scripts/check_contracts.py'
      - 'scripts/check_design_system.py'
      - 'scripts/sync_design_tokens.py'
      - '.github/workflows/contracts-design.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar validador de esquemas JSON
        run: python -m pip install 'jsonschema==4.23.0'
      - name: Verificar contratos versionados
        run: python scripts/check_contracts.py
