name: SMART UNI 9 CodeQL SAST
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'core/rust/**'
      - 'services/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'apps/**'
      - 'core/rust/**'
      - 'services/**'
      - '.github/workflows/codeql-phase9.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'javascript-typescript', 'java-kotlin', 'rust', 'c-cpp']
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: \${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:\${{ matrix.language }}"
