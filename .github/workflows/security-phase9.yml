name: SMART UNI 9 Seguridad y política de beta
on:
  push:
    branches: [main]
    paths:
      - 'scripts/phase9_*.py'
      - 'scripts/test_phase9_*.py'
      - 'services/api/tests/test_security_phase9.py'
      - 'services/api/requirements.txt'
      - 'apps/web/package.json'
      - 'apps/web/package-lock.json'
      - 'core/rust/Cargo.lock'
      - 'scripts/phase9_lockfile_gate.py'
      - 'scripts/test_phase9_lockfile_gate.py'
      - 'scripts/phase9_artifact_integrity.py'
      - 'scripts/test_phase9_artifact_integrity.py'
      - 'docs/phase-9/**'
      - 'apps/android/app/build.gradle'
      - 'apps/android/app/proguard-rules.pro'
      - 'apps/android/app/src/main/AndroidManifest.xml'
      - 'apps/android/app/src/main/cpp/bridge.cpp'
      - 'services/api/app/config.py'
      - '.github/workflows/security-phase9.yml'
  pull_request:
    paths:
      - 'scripts/phase9_*.py'
      - 'scripts/test_phase9_*.py'
      - 'core/rust/Cargo.lock'
      - 'apps/web/package-lock.json'
      - '.github/workflows/security-phase9.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mandatory-regression:
    name: Bloqueos de configuración, firmas y checklist beta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencia verificadora Ed25519
        run: python -m pip install "cryptography>=44,<48"
      - name: Probar fallos del verificador y las políticas
        run: python -m unittest discover -s scripts -p 'test_phase9_*.py' -v
      - name: Rechazar regresiones Android/backend de alto riesgo
        run: python scripts/phase9_security_gate.py
      - name: Verificar coherencia de lockfiles npm y Cargo
        run: python scripts/phase9_lockfile_gate.py
      - name: Demostrar que el gate de beta permanece cerrado
        shell: bash
        run: |
          if python scripts/phase9_beta_gate.py docs/phase-9/beta-evidence-template.json; then
            echo "ERROR: el checklist pendiente fue aprobado indebidamente" >&2
            exit 1
          fi
          echo "PASS: beta bloqueada por falta de evidencias verificadas"
  supply-chain-gate:
    name: Dependencias Python y npm deben estar libres de advisories registrados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar pip-audit
        run: python -m pip install pip-audit
      - name: Denegar dependencias backend vulnerables
        run: pip-audit -r services/api/requirements.txt
      - name: Validar lockfile sin instalar scripts npm
        working-directory: apps/web
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Denegar CVE npm altas y críticas
        working-directory: apps/web
        run: npm audit --audit-level=high
      - name: Instalar cargo-audit para control bloqueante
        uses: taiki-e/install-action@cargo-audit
      - name: Denegar avisos RustSec del núcleo
        run: cargo audit --file core/rust/Cargo.lock
  dependency-observation:
    name: SCA de dependencias (advisory; hallazgos bloquean beta)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar escáneres de dependencias y SAST Python
        run: python -m pip install pip-audit bandit
      - name: Preparar reportes
        run: mkdir -p audit-reports
      - name: Auditoría pip de servicio FastAPI
        continue-on-error: true
        run: pip-audit -r services/api/requirements.txt --format json --output audit-reports/backend-pip.json
      - name: Auditoría pip de escritorio
        continue-on-error: true
        run: pip-audit -r apps/desktop/requirements.txt --format json --output audit-reports/desktop-pip.json
      - name: Bandit Python (todas las severidades)
        continue-on-error: true
        run: bandit -r services/api/app apps/desktop/smart_uni --format json --output audit-reports/python-bandit.json
      - name: Verificar npm reproducible (lockfile comprometido)
        working-directory: apps/web
        continue-on-error: true
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Instalar escáner RustSec para Cargo.lock
        uses: taiki-e/install-action@cargo-audit
        continue-on-error: true
      - name: Auditoría RustSec del árbol Cargo.lock
        continue-on-error: true
        shell: bash
        run: cargo audit --json --file core/rust/Cargo.lock > audit-reports/rust-cargo-audit.json
      - name: Auditoría npm de portal
        working-directory: apps/web
        continue-on-error: true
        shell: bash
        run: npm audit --json > ../../audit-reports/web-npm.json
      - name: Publicar hallazgos crudos para triaje obligatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartuni-stage9-advisory-security-reports
          path: audit-reports/
          if-no-files-found: warn
          retention-days: 30
