name: Backend FastAPI PostgreSQL y OIDC
on:
  push:
    branches: [main]
    paths:
      - 'services/api/**'
      - '.github/workflows/backend-api.yml'
  pull_request:
    paths:
      - 'services/api/**'
      - '.github/workflows/backend-api.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartuni
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: smartuni_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartuni -d smartuni_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://smartuni:synthetic_ci_only@localhost:5432/smartuni_test
      OIDC_ISSUER: https://issuer.smartuni.invalid/realms/test
      OIDC_JWKS_URL: https://issuer.smartuni.invalid/realms/test/certs
      OIDC_AUDIENCE: smartuni-api
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar backend
        run: python -m pip install -r services/api/requirements.txt
      - name: Comprobar sintaxis
        run: python -m compileall -q services/api
      - name: Aplicar migraciones PostgreSQL
        run: alembic -c services/api/alembic.ini upgrade head
      - name: Ejecutar pruebas API con PostgreSQL y RSA real
        run: pytest services/api/tests/test_api.py services/api/tests/test_sync.py -q
      - name: Probar downgrade y re-upgrade
        run: |
          alembic -c services/api/alembic.ini downgrade base
          alembic -c services/api/alembic.ini upgrade head
