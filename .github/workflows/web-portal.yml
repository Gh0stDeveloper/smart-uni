name: Portal Next.js OIDC y seguridad
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-portal.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-portal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      # Variables sintéticas: nunca conectar a cuentas ni servidores reales durante CI.
      AUTH_SECRET: synthetic_only_not_for_production_6qCWmCpGh64pX7Yt
      AUTH_URL: https://portal.smartuni.invalid
      AUTH_KEYCLOAK_ID: smartuni-portal-ci
      AUTH_KEYCLOAK_SECRET: synthetic_client_secret_only
      AUTH_KEYCLOAK_ISSUER: https://issuer.smartuni.invalid/realms/test
      SMARTUNI_API_INTERNAL_URL: https://api.smartuni.invalid/
      PORTAL_ORIGIN: https://portal.smartuni.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias declaradas
        run: npm install --no-audit --no-fund
      - name: Ejecutar pruebas de seguridad de rutas
        run: npm run test
      - name: Validar TypeScript
        run: npm run typecheck
      - name: Compilar Next.js
        run: npm run build
      - name: Conservar lockfile generado como evidencia de resolución
        uses: actions/upload-artifact@v4
        with:
          name: smartuni-web-dependency-lock-ci
          path: apps/web/package-lock.json
          if-no-files-found: error
          retention-days: 30
      - name: HTTP smoke - denegar anónimos y origen CSRF ausente
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3000 > /tmp/smartuni-next.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --silent --output /dev/null http://127.0.0.1:3000/api/notes; then break; fi
            sleep 1
          done
          notes=$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:3000/api/notes)
          admin=$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:3000/api/admin/metrics)
          csrf=$(curl --silent --output /dev/null --write-out "%{http_code}" -X POST -H "Content-Type: application/json" -d '{"title":"x","content":"y"}' http://127.0.0.1:3000/api/notes)
          printf 'Anonymous notes: %s, admin: %s, missing Origin POST: %s\n' "$notes" "$admin" "$csrf"
          test "$notes" = "401"
          test "$admin" = "401"
          test "$csrf" = "403"
          logout=$(curl --silent --output /dev/null --write-out "%{http_code}" -X POST http://127.0.0.1:3000/api/session/revoke)
          test "$logout" = "403"
