name: Validar fases y subfases

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "scripts/check_phase_naming.py"
      - ".github/workflows/phase-naming.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check_phase_naming.py"
      - ".github/workflows/phase-naming.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Numeración oficial
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Comprobar documentación
        run: python scripts/check_phase_naming.py
