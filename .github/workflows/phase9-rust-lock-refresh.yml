name: SMART UNI 9 Refresh único Cargo.lock sin P-256
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase9-rust-lock-refresh.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: smartuni-phase9-cargo-lock-refresh
  cancel-in-progress: false
jobs:
  test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Regenerar lock según features limitadas a X25519
        run: cargo generate-lockfile --manifest-path core/rust/Cargo.toml
      - name: Comprobar que P-256 y crypto-bigint no entran al binario
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --locked --manifest-path core/rust/Cargo.toml --edges normal,build --prefix none > tree.txt
          python - <<'PY'
          from pathlib import Path
          names = Path("tree.txt").read_text(encoding="utf-8").splitlines()
          active = [n for n in names if n.startswith(("p256 v", "crypto-bigint v"))]
          if active:
              raise SystemExit("Dependencias criptográficas opcionales no deseadas: " + repr(active))
          print("PASS: P-256 y crypto-bigint ausentes del grafo compilado")
          PY
      - name: Ejecutar pruebas de Rust antes de mover lockfile
        run: cargo test --locked --manifest-path core/rust/Cargo.toml --all-targets
      - name: Publicar Cargo.lock en main sin force-push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/rust/Cargo.lock
          git diff --cached --quiet && exit 1
          git commit -m 'fix(9.1): resolver Cargo.lock con HPKE solo X25519'
          git push origin HEAD:main
