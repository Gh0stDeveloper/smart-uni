name: SMART UNI 7 - Sincronizacion cifrada integral
on:
  push:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'apps/desktop/smart_uni/encrypted_sync.py'
      - 'apps/desktop/smart_uni/secure_crypto.py'
      - '.github/workflows/sync-e2e.yml'
      - 'docs/phase-7/**'
      - 'docs/PENDIENTES_SMART_UNI_2_0.md'
  pull_request:
    paths:
      - 'services/api/**'
      - 'apps/desktop/smart_uni/encrypted_sync.py'
      - 'apps/desktop/smart_uni/secure_crypto.py'
      - '.github/workflows/sync-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encrypted-client-server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartuni
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: smartuni_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U smartuni -d smartuni_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://smartuni:synthetic_ci_only@localhost:5432/smartuni_test
      OIDC_ISSUER: https://issuer.smartuni.invalid/realms/test
      OIDC_JWKS_URL: https://issuer.smartuni.invalid/realms/test/certs
      OIDC_AUDIENCE: smartuni-api
      PYTHONPATH: .:apps/desktop
      SMARTUNI_NATIVE_LIB: ${{ github.workspace }}/core/rust/target/release/libsmartuni_core.so
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Compilar nucleo Rust para pruebas integrales
        run: cargo build --locked --manifest-path core/rust/Cargo.toml --release
      - name: Instalar dependencias del servidor y SQLCipher
        run: |
          python -m pip install -r services/api/requirements.txt
          python -m pip install -r apps/desktop/requirements-secure.txt
      - name: Migraciones reales PostgreSQL
        run: alembic -c services/api/alembic.ini upgrade head
      - name: Ejecucion E2E SQLCipher Rust API
        run: pytest services/api/tests/test_sync_e2e.py -vv
