name: Núcleo Rust SMART UNI 2.0

on:
  push:
    branches: [main]
    paths:
      - 'core/rust/**'
      - 'packages/contracts/v1/**'
      - 'apps/desktop/smart_uni/native_bridge.py'
      - 'apps/desktop/tests/test_phase3_native.py'
      - 'apps/desktop/smart_uni/secure_crypto.py'
      - 'apps/desktop/tests/test_phase6_interop.py'
      - 'apps/desktop/smart_uni/secure_files.py'
      - 'apps/desktop/tests/test_phase6_materials.py'
      - 'apps/desktop/smart_uni/key_recovery.py'
      - 'apps/desktop/tests/test_phase6_key_recovery.py'
      - 'apps/desktop/smart_uni/encrypted_sync.py'
      - 'apps/desktop/tests/test_phase7_sync_client.py'
      - 'scripts/check_crypto_vectors.py'
      - '.github/workflows/rust-core.yml'
      - 'docs/phase-7/**'
      - 'scripts/phase9_fuzz_ffi.py'
      - 'docs/PENDIENTES_SMART_UNI_2_0.md'
  pull_request:
    paths:
      - 'core/rust/**'
      - 'packages/contracts/v1/**'
      - 'apps/desktop/smart_uni/native_bridge.py'
      - 'apps/desktop/tests/test_phase3_native.py'
      - 'scripts/check_crypto_vectors.py'
      - '.github/workflows/rust-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formato Rust
        run: cargo fmt --manifest-path core/rust/Cargo.toml --all -- --check
      - name: Compilar y probar Rust
        run: cargo test --locked --manifest-path core/rust/Cargo.toml --all-targets --verbose
      - name: Clippy sin avisos
        run: cargo clippy --locked --manifest-path core/rust/Cargo.toml --all-targets -- -D warnings
      - name: Construir biblioteca C ABI
        run: cargo build --locked --manifest-path core/rust/Cargo.toml --release
      - name: Configurar la ruta FFI para las pruebas Python
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "SMARTUNI_NATIVE_LIB=$GITHUB_WORKSPACE/core/rust/target/release/smartuni_core.dll" >> "$GITHUB_ENV"
          else
            echo "SMARTUNI_NATIVE_LIB=$GITHUB_WORKSPACE/core/rust/target/release/libsmartuni_core.so" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mutaciones deterministas contra ABI Rust nativa (640 casos)
        run: python scripts/phase9_fuzz_ffi.py
      - name: Validar AES-GCM con implementacion independiente Python
        run: |
          python -m pip install "cryptography==44.0.2"
          python scripts/check_crypto_vectors.py
      - name: Instalar Argon2id de referencia independiente
        run: python -m pip install "argon2-cffi==23.1.0"
      - name: Validación cruzada Rust/OpenSSL/Argon2id (Python)
        working-directory: apps/desktop
        run: python -m unittest discover -s tests -p test_phase6_interop.py -v
      - name: Instalar SQLCipher y keyring para pruebas de adjuntos
        run: python -m pip install -r apps/desktop/requirements-secure.txt
      - name: Materiales cifrados integrados con SQLCipher y Rust
        working-directory: apps/desktop
        run: python -m unittest discover -s tests -p test_phase6_materials.py -v
      - name: Restauración de clave SQLCipher con paquete Argon2id
        working-directory: apps/desktop
        run: python -m unittest discover -s tests -p test_phase6_key_recovery.py -v
      - name: Probar sincronización local cifrada Windows/Linux sin red
        working-directory: apps/desktop
        run: python -m unittest discover -s tests -p test_phase7_sync_client.py -v
      - name: Prueba de enlace Python-ctypes a Rust
        working-directory: apps/desktop
        run: python -m unittest discover -s tests -p test_phase3_native.py -v
      - name: Probar C++ enlazado al núcleo en Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Icore/rust/include core/rust/examples/cpp/smoke.cpp -Lcore/rust/target/release -lsmartuni_core -Wl,-rpath,"$PWD/core/rust/target/release" -o /tmp/smartuni_cpp_smoke
          /tmp/smartuni_cpp_smoke

  android_aarch64:
    name: Android arm64 NDK - compilar y enlazar (sin emulador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Rust para Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Configurar Android NDK disponible
        shell: bash
        run: |
          set -eo pipefail
          if [ -n "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            NDK="$ANDROID_NDK_HOME"
          else
            SDK="$ANDROID_HOME"
            if [ -z "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
            NDK="$(find "$SDK/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TOOLCHAIN/aarch64-linux-android21-clang"
          test -x "$TOOLCHAIN/aarch64-linux-android21-clang++"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android21-clang" >> "$GITHUB_ENV"
          echo "ANDROID_CPP_COMPILER=$TOOLCHAIN/aarch64-linux-android21-clang++" >> "$GITHUB_ENV"
      - name: Compilar biblioteca Rust Android arm64
        run: |
          cargo build --locked --manifest-path core/rust/Cargo.toml --release --target aarch64-linux-android
          test -s core/rust/target/aarch64-linux-android/release/libsmartuni_core.so
      - name: Compilar cabecera C++ contra NDK
        run: |
          "$ANDROID_CPP_COMPILER" -std=c++17 -Wall -Wextra -Werror -Icore/rust/include -c core/rust/examples/cpp/smoke.cpp -o /tmp/smartuni_android_smoke.o
          test -s /tmp/smartuni_android_smoke.o
      - name: Publicar biblioteca Android de validación
        uses: actions/upload-artifact@v4
        with:
          name: smartuni-rust-android-arm64
          path: |
            core/rust/target/aarch64-linux-android/release/libsmartuni_core.so
            core/rust/include/smartuni_core.h
          if-no-files-found: error
          retention-days: 30
