name: SMART UNI 8 Android Java JNI Rust
on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'core/rust/**'
      - 'packages/design-system/tokens.json'
      - '.github/workflows/android.yml'
      - 'docs/phase-8/**'
      - 'scripts/phase9_artifact_integrity.py'
  pull_request:
    paths:
      - 'apps/android/**'
      - 'core/rust/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: APK debug + APK/AAB release sin firma + tests Android x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar SDK 35 y NDK 27
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path "*/bin/sdkmanager" | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1" "platform-tools"
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang" >> "$GITHUB_ENV"
      - name: Compilar núcleo Rust Android para teléfono y emulador
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path core/rust/Cargo.toml --release --target aarch64-linux-android
          cargo build --locked --manifest-path core/rust/Cargo.toml --release --target x86_64-linux-android
          test -s core/rust/target/aarch64-linux-android/release/libsmartuni_core.a
          test -s core/rust/target/x86_64-linux-android/release/libsmartuni_core.a
      - name: Construir APK y AAB desde Java JNI Rust
        working-directory: apps/android
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease :app:bundleRelease
      - name: Probar firma debug y rechazo de release sin certificado
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/android/app/build/outputs
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            apps/android/app/build/outputs/apk/debug/app-debug.apk \
            > apps/android/app/build/outputs/phase9-debug-signing.txt
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            apps/android/app/build/outputs/apk/release/app-release-unsigned.apk >/dev/null 2>&1; then
            echo "ERROR: el APK release se firmó fuera de la configuración esperada" >&2
            exit 1
          fi
          if jar tf apps/android/app/build/outputs/bundle/release/app-release.aab \
            | grep -E '^META-INF/[^/]+\\.(RSA|DSA|EC)
        uses: actions/upload-artifact@v4
        with:
          name: smart-uni-android-fase8-sin-firma-produccion
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
            apps/android/app/build/outputs/bundle/release/app-release.aab
            apps/android/app/build/outputs/phase9-artifacts.json
            apps/android/app/build/outputs/phase9-debug-signing.txt
          if-no-files-found: error
          retention-days: 14
      - name: Habilitar aceleración KVM de Android
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true
      - name: Probar JNI Rust y Android Keystore en emulador real
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          disable-spellchecker: true
          emulator-boot-timeout: 900
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android_instrumentation.sh
      - name: Capturar diagnóstico limitado del emulador
        if: failure()
        shell: bash
        run: |
          mkdir -p apps/android/app/build/diagnostics
          timeout 15s adb logcat -d -t 3000 -v threadtime > apps/android/app/build/diagnostics/emulator.log || true

      - name: Guardar resultados de instrumentación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-uni-android-pruebas-fase8
          path: |
            apps/android/app/build/outputs/androidTest-results/**
            apps/android/app/build/reports/androidTests/**
            apps/android/app/build/diagnostics/**
          if-no-files-found: warn
          retention-days: 14
; then
            echo "ERROR: AAB release firmado inesperadamente" >&2
            exit 1
          fi
      - name: Generar y verificar recibo de laboratorio con SHA256 y ZIP
        shell: bash
        run: |
          set -euo pipefail
          python scripts/phase9_artifact_integrity.py create \
            --sha "$GITHUB_SHA" --receipt apps/android/app/build/outputs/phase9-artifacts.json
          python scripts/phase9_artifact_integrity.py verify \
            --receipt apps/android/app/build/outputs/phase9-artifacts.json
      - name: Guardar artefactos de laboratorio
        uses: actions/upload-artifact@v4
        with:
          name: smart-uni-android-fase8-sin-firma-produccion
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
            apps/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Habilitar aceleración KVM de Android
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true
      - name: Probar JNI Rust y Android Keystore en emulador real
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          disable-spellchecker: true
          emulator-boot-timeout: 900
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android_instrumentation.sh
      - name: Capturar diagnóstico limitado del emulador
        if: failure()
        shell: bash
        run: |
          mkdir -p apps/android/app/build/diagnostics
          timeout 15s adb logcat -d -t 3000 -v threadtime > apps/android/app/build/diagnostics/emulator.log || true

      - name: Guardar resultados de instrumentación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-uni-android-pruebas-fase8
          path: |
            apps/android/app/build/outputs/androidTest-results/**
            apps/android/app/build/reports/androidTests/**
            apps/android/app/build/diagnostics/**
          if-no-files-found: warn
          retention-days: 14
