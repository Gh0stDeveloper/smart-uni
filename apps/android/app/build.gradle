plugins {
    id 'com.android.application'
}

android {
    namespace 'xyz.smartuni.app'
    compileSdk 35
    ndkVersion '27.2.12479018'

    // Identificadores OIDC públicos por entorno: jamás inyectar secretos de cliente.
    def issuer = (System.getenv('SMARTUNI_OIDC_ISSUER') ?: '').trim()
    def clientId = (System.getenv('SMARTUNI_OIDC_CLIENT_ID') ?: '').trim()
    def apiOrigin = (System.getenv('SMARTUNI_API_ORIGIN') ?: '').trim()
    if (issuer && !(issuer ==~ /^https:\/\/[A-Za-z0-9.-]+(?::[0-9]{1,5})?(?:\/[A-Za-z0-9._\/-]*)?$/)) {
        throw new GradleException('SMARTUNI_OIDC_ISSUER requiere HTTPS sin fragment ni query')
    }
    if (clientId && !(clientId ==~ /^[A-Za-z0-9_.-]{1,120}$/)) {
        throw new GradleException('SMARTUNI_OIDC_CLIENT_ID inválido')
    }
    if (apiOrigin && !(apiOrigin ==~ /^https:\/\/[A-Za-z0-9.-]+(?::[0-9]{1,5})?$/)) {
        throw new GradleException('SMARTUNI_API_ORIGIN debe ser origen HTTPS')
    }
    buildFeatures { buildConfig true }

    defaultConfig {
        manifestPlaceholders = [appAuthRedirectScheme: 'xyz.smartuni.app']
        buildConfigField "String", "OIDC_ISSUER", '"' + issuer + '"'
        buildConfigField "String", "OIDC_CLIENT_ID", '"' + clientId + '"'
        buildConfigField "String", "API_ORIGIN", '"' + apiOrigin + '"'
        applicationId 'xyz.smartuni.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '2.0.0-dev8'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        if (System.getenv('SMARTUNI_SIGNING_STORE_FILE') &&
            System.getenv('SMARTUNI_SIGNING_STORE_PASSWORD') &&
            System.getenv('SMARTUNI_SIGNING_KEY_ALIAS') &&
            System.getenv('SMARTUNI_SIGNING_KEY_PASSWORD')) {
            release {
                storeFile file(System.getenv('SMARTUNI_SIGNING_STORE_FILE'))
                storePassword System.getenv('SMARTUNI_SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SMARTUNI_SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SMARTUNI_SIGNING_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            if (signingConfigs.findByName('release') != null) {
                signingConfig signingConfigs.getByName('release')
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    testOptions {
        animationsDisabled true
    }
    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

dependencies {
    // Biblioteca OIDC de OAuth 2.0 para apps nativas, con PKCE/state/nonce y navegador.
    implementation 'net.openid:appauth:0.11.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
