[package]
name = "smartuni-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "SMART UNI dominio y contratos compartidos"
publish = false

[lib]
name = "smartuni_core"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.38", default-features = false, features = ["std"] }
aes-gcm = "=0.10.3"
hex = "=0.4.3"
argon2 = "=0.5.3"
hpke = { version = "=0.12.0", features = ["std", "x25519"] }
zeroize = "=1.8.2"
